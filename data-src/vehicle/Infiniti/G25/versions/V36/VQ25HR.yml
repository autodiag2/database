# The ECM identifies itself through Nissan's Consult block (21 83), not UDS
# 22 F18A/F187 — this generation rejects those with 7F 22 80, and refuses the
# extended session with 7F 10 12. 1VW3C is the 5-character spare-part number
# read from the block; the full Nissan number carries a family prefix that the
# module does not report, so it is not written here.
